name: Release-plz

# Runs on every push to `main`, opens/updates a release PR that bumps the
# version and updates CHANGELOG.md. When that PR is merged, publishes to
# crates.io and pushes a git tag.
#
# Requires the following repository secrets:
# - CARGO_REGISTRY_TOKEN — crates.io API token with publish scope
# The default GITHUB_TOKEN is sufficient for opening PRs and pushing tags.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
